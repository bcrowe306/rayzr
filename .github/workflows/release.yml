# Publishes a GitHub Release with every platform's build:
#   - a dev build for every push to main that passes CI (every merged
#     feature / fix): v<VERSION>-dev.<n>, n = main's commit count, a
#     pre-release tagged on that commit (VERSION: the next release);
#   - a release when a version tag is pushed (v1.2.3, v0.4.0-beta.1) - then
#     bump VERSION so the dev builds after it sort above it.
# Each one builds (build-packages.yml - the install checks build the same,
# install-check.yml):
#   1. the runners on each platform (macOS, Linux, Windows), the web runner
#      and the Android runner;
#   2. the editor packaged on each platform with every platform's runners in
#      it (any editor exports every desktop target and the web);
# then publishes:
#   3. a GitHub Release with the packages and their SHA-256 checksums
#      (a pre-release when the version has a suffix, e.g. -beta.1);
#   4. the website: the packages uploaded to its downloads (R2; the newest 3
#      releases and the latest dev build kept), then rayzr.app rebuilt with
#      the docs of those versions, deployed and verified
#      (bcrowe306/rayzr_website's site.yml).
# Signing: macOS packages are ad-hoc signed unless the MACOS_* secrets are
# set (Developer ID + notarization: TODO C.4); Windows ones are unsigned
# (TODO C.5).
name: Release

on:
  # A dev build: CI passed on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
    # A dry run: everything but the GitHub Release (push to this branch).
    branches: [release-dryrun]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no tag, no release: a dry run)"
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: write

# (One build per commit: a re-run CI doesn't start a second.)
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    runs-on: ubuntu-22.04
    # (Dev builds: only when CI passed on a push - not a pull request's run.)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # (the commit count, the tags)
      - id: v
        run: |
          base=$(tr -d ' \n' < VERSION)
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # A released VERSION would make dev builds sort below it.
            if git rev-parse -q --verify "refs/tags/v$base" > /dev/null; then
              echo "::error::v$base is released: bump VERSION (the next release) for dev builds"
              exit 1
            fi
            v="$base-dev.$(git rev-list --count HEAD)"
            if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
              echo "::notice::v$v exists (a re-run): nothing to build"
              v=""
            else
              publish=true
            fi
          else
            case "$GITHUB_REF" in
              refs/tags/v*)
                v="${GITHUB_REF_NAME#v}"; publish=true
                case "$v" in "$base"|"$base"-*) ;; *) echo "::warning::tag $v doesn't match VERSION ($base)" ;; esac ;;
              *) v="${{ inputs.version }}"; [ -n "$v" ] || v="0.0.0-dryrun.${{ github.run_number }}" ;;
            esac
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Version: $v ($(git rev-parse --short HEAD))"

  # The packages (build-packages.yml, also run by install-check.yml):
  # editor-macos, editor-linux, editor-windows artifacts.
  packages:
    name: Packages
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}
    secrets: inherit

  publish:
    name: GitHub Release
    needs: [version, packages]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: editor-*
          path: release
          merge-multiple: true
      - run: (cd release && sha256sum rayzr-editor-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # (A dev build's tag is made here, on its commit.)
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Rayzr Editor ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release/*

      # The website's downloads (https://rayzr.app/download): the packages on
      # R2 (downloads.rayzr.app), the newest 3 releases and the latest dev
      # build kept (scripts/ci/publish_r2.py).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: src
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Publish to the website's downloads (R2)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # (the CDN cache purge)
        run: |
          pip install --quiet boto3
          python3 src/scripts/ci/publish_r2.py --version "${{ needs.version.outputs.version }}" \
            --dir release --commit "${{ needs.version.outputs.sha }}"

  website:
    name: Website (rayzr.app)
    needs: [version, publish]
    # (The site's docs and downloads follow every published build.)
    uses: bcrowe306/rayzr_website/.github/workflows/site.yml@main
    with:
      deploy: true
      reason: "Rayzr ${{ needs.version.outputs.version }} published"
    secrets: inherit
