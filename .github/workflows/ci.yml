# Builds the editor, the runner and the Play binary and runs the unit tests
# on macOS (Apple silicon), Linux (x64) and Windows (x64); builds the web
# runner (js_wasm32, as the release does - #224); smoke-tests the
# runner and the packaged editor on Linux under Xvfb. The templates'
# scripted play-throughs (#329: scripts/templates/test_templates.py) run on
# every platform: Linux (Xvfb), macOS (when the runner has OpenGL - GitHub's
# macOS VMs don't: played locally there),
# Windows (Mesa's llvmpipe: scripts/ci/mesa_windows.sh), the web (the web
# runner in headless Chrome) and Android (an emulator). Editor drives
# (tests/drive) stay local: they're long and need a real GPU session.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ODIN_RELEASE: dev-2026-03

jobs:
  # The web runner (js_wasm32 + Emscripten), as release.yml builds it: an
  # engine change that doesn't compile for the web (core:os, #223) fails
  # here instead of at release time.
  web-runner:
    name: Runner (web)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v14
        # (Pinned: Emscripten 7.0.0's libc++ no longer pulls in <iterator>,
        # which Clipper2 2.0.1 needs - scripts/build_clipper.sh.)
        with:
          version: 6.0.13
      - run: scripts/build_web_runner.sh
      - run: test -s bin/runners/web/index.wasm && test -s bin/runners/web/index.js
      # The templates played in the web runner (#329): headless Chrome (the
      # image's google-chrome; WebGL 2 on SwiftShader), driven over the
      # DevTools protocol by Node (22+: its WebSocket); each test's project
      # packed by scripts/pack_rayzr.odin (the engine built natively: its deps).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/ci/setup_deps.sh
      - name: Template play-throughs (web)
        run: CHROME="$(command -v google-chrome)" python3 scripts/templates/test_templates.py --web platformer shmup puzzle adventure rpg dungeon hex visual_novel vector_character
      # The tutorials' projects too (the level generator's, #385: Odin's
      # runtime start-up - computed globals - must run on the web).
      - name: Tutorial play-throughs (web)
        run: CHROME="$(command -v google-chrome)" python3 scripts/templates/test_templates.py --web --suite tests/tutorials/runtime_tests.json

  # The Android runner (linux_arm64 / android + the NDK), as release.yml
  # builds it; then a test app packaged and checked (APK + AAB). The runner
  # image has the Android SDK and NDK.
  android-runner:
    name: Runner (Android)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: scripts/build_android_runner.sh
      # (Packing the project runs the engine on this machine: Box2D, Clipper2.)
      - run: scripts/ci/setup_deps.sh
      - run: scripts/package_android.sh templates/platformer /tmp/android_app
      - run: scripts/check_android_package.sh /tmp/android_app/platformer.apk com.rayzr.platformer /tmp/android_app/platformer.aab

  # The templates played on Android (#329): an x86_64 emulator (KVM; API 34
  # Google APIs - it runs arm64 apps through its ARM translation), each
  # template packaged with a runner built with the test hooks (never shipped:
  # runner/android/main.odin) and played by scripts/ci/android_playthroughs.sh.
  android-playthroughs:
    name: Template play-throughs (Android emulator)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: OUT=bin/runners/android-test scripts/build_android_runner.sh -define:RAYZR_TEST_HOOKS=true
      # (Packing the projects runs the engine on this machine: Box2D, Clipper2.)
      - run: scripts/ci/setup_deps.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # (API 34: API 30's ARM translation, ndk_translation 0.2.2, stops the
          # runner with SIGILL - "Undefined instruction" on an AdvSIMD scalar FCVTZS.)
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: scripts/ci/android_playthroughs.sh platformer shmup puzzle adventure rpg dungeon hex visual_novel vector_character

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # (The smoke tests run on Linux under Xvfb; the template play-throughs everywhere.)
          - { name: macOS arm64, os: macos-15, platform: macos, smoke: false }
          - { name: Linux x64, os: ubuntu-22.04, platform: linux, smoke: true }
          - { name: Windows x64, os: windows-2022, platform: windows, smoke: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Submodules (not lua-language-server)
        run: git submodule update --init --depth 1 ui odin_editor ldtk

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Dependencies
        run: scripts/ci/setup_deps.sh

      - name: Build
        run: |
          mkdir -p bin
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          odin build editor $(scripts/odin_flags.sh) -out:bin/editor$ext
          odin build . $(scripts/odin_flags.sh) -out:bin/rayzr$ext
          scripts/build_runners.sh

      - name: Unit tests
        run: |
          odin test engine -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true $(scripts/odin_flags.sh)
          odin test ui -define:ODIN_TEST_THREADS=1 $(scripts/odin_flags.sh)

      # The templates' scripted play-throughs (#329) - Linux plays them below
      # (Templates, under Xvfb). Windows has no GPU driver: Mesa's llvmpipe
      # next to a copy of the runner. macOS: GitHub's macOS VMs have no
      # accelerated OpenGL - GLFW's NSGL (raylib's window) only takes an
      # accelerated pixel format ("NSGL: Failed to find a suitable pixel
      # format"; no software renderer, and raylib resets GLFW's hints, so no
      # OSMesa either). So here the runner is checked to say so and exit 1
      # (raylib 5.5 used to abort in InitWindow: engine/gl_window_check.odin);
      # the play-throughs run when a window opens (a GPU runner), and are
      # otherwise played on a Mac locally (python3
      # scripts/templates/test_templates.py).
      - name: Template play-throughs (macOS, when the runner has OpenGL)
        if: runner.os == 'macOS'
        run: |
          set +e
          out=$(bin/runners/macos/runner templates/platformer --frames 5 --hidden --user-data "$RUNNER_TEMP/gl_probe" 2>&1)
          code=$?
          set -e
          if [ $code = 0 ]; then
            python3 scripts/templates/test_templates.py --runner bin/runners/macos/runner
          elif [ $code = 1 ] && grep -q "Could not open the game window" <<< "$out"; then
            echo "::warning::macOS play-throughs not run: this runner has no accelerated OpenGL ($(grep -o 'Could not open the game window.*' <<< "$out" | head -1)). The runner exited cleanly; play them on a Mac locally."
          else
            echo "$out" | tail -40
            echo "::error::the runner didn't exit cleanly without OpenGL (exit $code)"
            exit 1
          fi
      - name: Template play-throughs (Windows, Mesa llvmpipe)
        if: runner.os == 'Windows'
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          scripts/ci/mesa_windows.sh bin/runners/windows/runner.exe "$RUNNER_TEMP/glrunner"
          py=python3; command -v python3 > /dev/null || py=python
          "$py" scripts/templates/test_templates.py --runner "$RUNNER_TEMP/glrunner/runner.exe"

      - name: Smoke test (the runner plays the demo project)
        if: matrix.smoke
        run: |
          cmd=(bin/runners/${{ matrix.platform }}/runner assets/demo_project --frames 60 --hidden
            --screenshot "$RUNNER_TEMP/runner.png" --dump-scene "$RUNNER_TEMP/scene.json")
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${cmd[@]}"; else "${cmd[@]}"; fi
          test -s "$RUNNER_TEMP/runner.png" && grep -q '"root"' "$RUNNER_TEMP/scene.json"

      - name: Docs in step with the code (node reference regenerated by the editor)
        if: matrix.smoke
        run: python3 scripts/docs/check_docs.py --editor bin/editor

      - name: Templates (generated from scripts/templates, and their games play)
        if: matrix.smoke
        run: |
          python3 scripts/templates/make_templates.py
          git diff --exit-code -- templates ':!templates/*/preview.png' || { echo "::error::templates/ differ from scripts/templates/make_templates.py's output: run it and commit"; exit 1; }
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner
          # Aseprite files played by the runner (AsepriteNode, Aseprite tilemaps).
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/aseprite/runtime_tests.json
          # Gamepads (simulated): players, hot-plug, rumble, prompts.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/gamepads/runtime_tests.json
          # Vector art (Phase 14): renders compared with tests/vector/expected (both draw paths, a zoom), the benchmark scene.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/vector/runtime_tests.json
          # State machines: the guide's tutorial scenes and scripts (engine/docs/state_machine.md) played by the runner.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/state_machine/runtime_tests.json
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/tile_anims/runtime_tests.json
          # Chunked level generation (#171): a camera flying into negative chunks, chunks in and out.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/levelgen_chunks/runtime_tests.json
          # Height layers (#171): a 3-level height map into stacked TileMaps, terrain edges, cliff faces, walls.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/levelgen_heights/runtime_tests.json
          # The developer console (#285): open, help, a Lua result, debug drawing.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/console/runtime_tests.json
          # Viewports (#279): a minimap, an in-world screen through a Sprite, split-screen.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/viewport/runtime_tests.json
          # Pixel-art rendering (#409): smooth camera with a still followed sprite, Native text, sharp-bilinear Fit.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/pixel_render/runtime_tests.json
          # Normal-mapped lighting (#274): a point light, the sun, sun shadows.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/normal_maps/runtime_tests.json
          # Crisp text (#270): MSDF for scaled and rotated text, text along a path.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/text_msdf/runtime_tests.json
          # Oscillators: waves on properties; pause / resume / signals / Stop restoring.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/oscillator/runtime_tests.json
          # Behavior Trees: Move To, a Lua leaf, a blackboard guard.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/behavior_tree/runtime_tests.json
          # GOAP: planning through a condition, moving to targets, a goal completing.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/goap/runtime_tests.json
          # The tutorials' finished projects (docs/tutorials/<name>/, #295): each loads and plays.
          xvfb-run -a python3 scripts/templates/test_templates.py --runner bin/runners/linux/runner --suite tests/tutorials/runtime_tests.json

      - name: Crash reports (the runner and the editor crash for real)
        if: matrix.smoke
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a scripts/test_crash.sh; else scripts/test_crash.sh; fi

      - name: Package and smoke-test the editor
        if: matrix.smoke
        run: |
          scripts/ci/fetch_luals.sh
          scripts/package_editor.sh --out dist --version "0.0.0-ci.${{ github.run_number }}"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a scripts/test_package.sh dist; else scripts/test_package.sh dist; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/runner.png
            /tmp/rayzr_package_test.*/shots
            /tmp/rayzr_package_test.*/editor.log
          if-no-files-found: ignore
          retention-days: 7
