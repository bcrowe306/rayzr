<?xml version="1.0" encoding="UTF-8"?>
<!-- Pip, the Vector Character template's hero (drawn for Rayzr; the repo's
     licence). One named group (a layer in Inkscape) per part, back to front,
     so Explode into Parts gives a Vector Shape each:
       arm_back, leg_back, leg_front, body, head, eyes, mouth, arm_front
     "eyes" and "mouth" are swap sets: their child groups are the frames
     (eyes open / closed; mouths named after Rhubarb Lip Sync's shapes
     X A B C D E F). Frames other than the first are hidden, as Inkscape
     saves a hidden layer: picked by the Vector Shape's Frame, they show.
     Drawn standing in the rig's setup pose (rigs/pip.json): feet on y = 400,
     hips at y = 270, neck at y = 180, shoulders at y = 192, all on x = 150. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa04f"/>
      <stop offset="1" stop-color="#e5602a"/>
    </linearGradient>
    <linearGradient id="sleeveBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9773c"/>
      <stop offset="1" stop-color="#b84d22"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4766a3"/>
      <stop offset="1" stop-color="#2f4677"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4029"/>
      <stop offset="1" stop-color="#3a2116"/>
    </linearGradient>
    <radialGradient id="face" cx="0.62" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffe2c6"/>
      <stop offset="1" stop-color="#efb488"/>
    </radialGradient>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="arm_back" id="arm_back">
    <rect x="140" y="186" width="20" height="112" rx="10" fill="#dfa279" stroke="#3b2418" stroke-width="3"/>
    <rect x="136" y="180" width="28" height="46" rx="13" fill="url(#sleeveBack)" stroke="#3b2418" stroke-width="3"/>
    <circle cx="150" cy="302" r="11" fill="#dfa279" stroke="#3b2418" stroke-width="3"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="leg_back" id="leg_back">
    <rect x="134" y="262" width="18" height="124" rx="9" fill="#2a3d66" stroke="#3b2418" stroke-width="3"/>
    <path d="M130 398 C130 386 138 380 146 380 C158 380 168 388 170 398 Z" fill="#7d2f2a" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="leg_front" id="leg_front">
    <rect x="148" y="262" width="18" height="124" rx="9" fill="url(#pants)" stroke="#3b2418" stroke-width="3"/>
    <path d="M144 398 C144 386 152 380 160 380 C172 380 182 388 184 398 Z" fill="#b03c33" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="body" id="body">
    <rect x="142" y="164" width="16" height="22" rx="4" fill="#efb488" stroke="#3b2418" stroke-width="3"/>
    <path d="M121 250 L179 250 L183 284 C172 290 160 290 152 282 L148 282 C140 290 128 290 117 284 Z" fill="url(#pants)" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
    <path d="M124 190 C124 180 138 176 150 176 C162 176 176 180 176 190 L181 258 C181 270 119 270 119 258 Z" fill="url(#shirt)" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
    <path d="M122 226 L178 226" fill="none" stroke="#ffd166" stroke-width="7"/>
    <path d="M140 179 Q150 190 160 179" fill="none" stroke="#3b2418" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="head" id="head">
    <circle cx="156" cy="112" r="58" fill="url(#face)" stroke="#3b2418" stroke-width="3"/>
    <path d="M100 118 C92 74 118 50 156 50 C190 50 212 66 214 92 C200 82 184 80 172 88 C166 76 150 72 138 82 C134 94 132 104 134 112 C124 104 108 106 100 118 Z" fill="url(#hair)" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="124" cy="120" r="12" fill="#efb488" stroke="#3b2418" stroke-width="3"/>
    <path d="M120 120 Q125 114 128 122" fill="none" stroke="#c4805a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="212" cy="127" rx="10" ry="9" fill="#efb488" stroke="#3b2418" stroke-width="3"/>
    <path d="M166 89 Q174 84 182 89 M191 87 Q198 82 205 87" fill="none" stroke="#3b2418" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="168" cy="134" rx="9" ry="5.5" fill="#f08a7a" opacity="0.55"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="eyes" id="eyes">
    <g id="open">
      <ellipse cx="176" cy="108" rx="8" ry="11" fill="#ffffff" stroke="#3b2418" stroke-width="2.5"/>
      <ellipse cx="200" cy="107" rx="7" ry="10" fill="#ffffff" stroke="#3b2418" stroke-width="2.5"/>
      <circle cx="179" cy="110" r="4.5" fill="#2a1a12"/>
      <circle cx="202" cy="109" r="4" fill="#2a1a12"/>
      <circle cx="180.5" cy="108" r="1.5" fill="#ffffff"/>
      <circle cx="203.5" cy="107" r="1.4" fill="#ffffff"/>
    </g>
    <g id="closed" style="display:none">
      <path d="M168 110 Q176 116 184 110 M193 109 Q200 115 207 109" fill="none" stroke="#3b2418" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="mouth" id="mouth">
    <!-- X: rest -->
    <g id="X">
      <path d="M182 144 Q192 151 202 144" fill="none" stroke="#3b2418" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- A: closed (M B P) -->
    <g id="A" style="display:none">
      <path d="M182 146 Q192 149 202 146" fill="none" stroke="#3b2418" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- B: slightly open, teeth (most consonants) -->
    <g id="B" style="display:none">
      <path d="M182 143 Q192 141 202 143 Q200 153 192 153 Q184 153 182 143 Z" fill="#6b2226" stroke="#3b2418" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M185 144 L199 144" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- C: open (E) -->
    <g id="C" style="display:none">
      <ellipse cx="192" cy="147" rx="10" ry="6" fill="#6b2226" stroke="#3b2418" stroke-width="2.5"/>
      <path d="M186 143.5 L198 143.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- D: wide open (A) -->
    <g id="D" style="display:none">
      <path d="M180 141 Q192 138 204 141 Q204 162 192 162 Q180 162 180 141 Z" fill="#6b2226" stroke="#3b2418" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="192" cy="156" rx="7" ry="4" fill="#e0606a"/>
      <path d="M184 143 L200 143" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- E: round (O) -->
    <g id="E" style="display:none">
      <ellipse cx="192" cy="148" rx="7" ry="9" fill="#6b2226" stroke="#3b2418" stroke-width="2.5"/>
    </g>
    <!-- F: puckered (U W) -->
    <g id="F" style="display:none">
      <ellipse cx="192" cy="147" rx="5.5" ry="5" fill="#6b2226" stroke="#c25a4a" stroke-width="3"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="arm_front" id="arm_front">
    <rect x="140" y="186" width="20" height="112" rx="10" fill="#efb488" stroke="#3b2418" stroke-width="3"/>
    <rect x="136" y="180" width="28" height="46" rx="13" fill="url(#shirt)" stroke="#3b2418" stroke-width="3"/>
    <circle cx="150" cy="302" r="11" fill="#efb488" stroke="#3b2418" stroke-width="3"/>
  </g>
</svg>
